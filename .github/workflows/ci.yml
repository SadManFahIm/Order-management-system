name: CI

# Triggers: push to master, pull requests targeting master, a nightly
# scheduled run (catches schema drift / flakiness that PRs miss), and manual
# runs.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # 03:00 UTC = 09:00 Dhaka (UTC+6) — full pipeline incl. the PostgreSQL
    # tier runs against master every night, so drift never survives the week.
    - cron: '0 3 * * *'
  workflow_dispatch:

# One live run per branch/PR: a superseded run cancels the one before it
# instead of queuing behind it (observed: a wedged stale run held the PG
# service containers and starved the fresh run's jobs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read-only token by default for every job. Scopes that need
# more are granted per-job below (only the e2e report upload writes).
permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint, test, audit
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-not-for-production
      DB_STORAGE: ./data.ci.sqlite
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Coverage gate
        # Hard floor on lines/functions/branches/statements (vitest.config.js)
        # — fails the build when a change drags coverage below the floor.
        run: npm run test:coverage
      - name: Dependency audit
        # Shared graceful audit gate (scripts/ci-audit.mjs): fails on real
        # high/critical findings, but tolerates npm's retiring legacy audit
        # endpoint (503 / "Invalid package tree" / timeouts), which would
        # otherwise fail CI at random. Vulnerability coverage continues via
        # Dependabot + dependency-review.
        run: node ../scripts/ci-audit.mjs

  security:
    # Secret scan — gitleaks flags accidental credentials/API keys across the
    # whole git history (not just the diff), so a leaked secret is caught the
    # moment it lands, before it reaches production.
    name: Security — gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-postgres:
    # PostgreSQL integration tier — proves the migration runner and the full
    # test suite against a real PostgreSQL 16 (the V2 production database).
    name: Backend — PostgreSQL 16 (migrate, test, smoke)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oms
          POSTGRES_PASSWORD: oms
          POSTGRES_DB: oms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oms -d oms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-not-for-production
      DB_DIALECT: postgres
      DATABASE_URL: postgres://oms:oms@localhost:5432/oms_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations on a fresh PostgreSQL
        run: npm run db:migrate
      - name: Verify migration status
        run: npm run db:migrate:status
      - name: Full test suite against PostgreSQL
        run: npm test
      - name: Reset to the pure migration schema
        # The test suite sync()-recreates model tables (a column subset of the
        # migration DDL) and leaves schema_migrations intact, so a bare
        # `db:migrate` would no-op. Reset so the v1→v2 copy and boot smoke run
        # against the real migration schema.
        run: npm run db:reset
      - name: v1 → v2 data migration against PostgreSQL
        run: |
          node scripts/make-v1-fixture.js
          node scripts/migrate-v1-to-v2.js --source ./fixture-v1.sqlite --force
      - name: Seed + production-mode boot smoke
        run: |
          npm run seed:admin -- --name "CI Admin" --email ci@oms.dev --password "CiStr0ngPass!42"
          NODE_ENV=production node scripts/smoke-pg.js

  e2e:
    # Browser-level suite: the real API on a PostgreSQL 16 service + the Vite
    # app, driven with Playwright (login, product CRUD, order creation, the
    # public storefront menu, and the full guest checkout journey).
    name: E2E — Playwright (browser, PostgreSQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The failure-only report artifact is uploaded via the Actions API.
      actions: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oms
          POSTGRES_PASSWORD: oms
          POSTGRES_DB: oms_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oms -d oms_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_DIALECT: postgres
      DATABASE_URL: postgres://oms:oms@localhost:5432/oms_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run e2e tests
        run: npx playwright test
        working-directory: frontend
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  gateway-sandbox:
    # Online-payment tier — boots the REAL backend against the local gateway
    # sandbox (mock SSLCommerz + Stripe with real signature math, bKash with
    # a faithful callback → execute round-trip) and drives the full loop for
    # ALL THREE gateways (order → pending + paymentUrl → confirmation → paid).
    # Proves the gateway integration on every PR without external
    # credentials; exits non-zero unless all three flows pass.
    name: Backend — gateway sandbox E2E (SSLCommerz + Stripe + bKash)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-not-for-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run gateway test-mode E2E (all three gateways)
        run: npm run gateway:e2e

  s3-storage:
    # S3-compatible storage tier — runs the image-pipeline driver against a
    # real MinIO instance (put → public URL → remove round-trip). MinIO is
    # downloaded and run in-process because the minio/minio docker image has
    # no curl for a health check and is flaky as a GH service container.
    name: Backend — S3 driver vs MinIO
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-not-for-production
      DB_STORAGE: ./data.s3.sqlite
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: oms-test
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Start MinIO in the background
        run: |-
          mkdir -p /tmp/minio/data
          curl -sSL -o /tmp/minio/minio https://dl.min.io/server/minio/release/linux-amd64/minio
          chmod +x /tmp/minio/minio
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            /tmp/minio/minio server /tmp/minio/data --address :9000 > /tmp/minio/server.log 2>&1 &
          # Wait for the health endpoint.
          for i in $(seq 1 30); do
            if curl -fs http://localhost:9000/minio/health/live > /dev/null 2>&1; then
              echo 'MinIO ready'; exit 0
            fi
            sleep 1
          done
          cat /tmp/minio/server.log
          echo 'MinIO did not become ready in time' >&2
          exit 1
      - name: Create the test bucket
        run: |-
          node --input-type=module -e "
            import { S3Client, CreateBucketCommand } from '@aws-sdk/client-s3';
            const c = new S3Client({ region: 'us-east-1',
              endpoint: 'http://localhost:9000', forcePathStyle: true,
              credentials: { accessKeyId: 'minioadmin', secretAccessKey: 'minioadmin' } });
            // MinIO boots in ~1–2s; the service container has no health check,
            // so retry until the API answers (max ~30s).
            for (let i = 0; i < 30; i += 1) {
              try {
                await c.send(new CreateBucketCommand({ Bucket: 'oms-test' }));
                console.log('bucket ready');
                process.exit(0);
              } catch (e) {
                if (/BucketAlreadyOwned|409|Already exists/.test(String(e))) {
                  console.log('bucket ready (already exists)');
                  process.exit(0);
                }
                await new Promise((r) => setTimeout(r, 1000));
              }
            }
            console.error('MinIO did not become ready in time');
            process.exit(1);
          "
      - name: Run the S3 driver test suite
        run: npx vitest run src/__tests__/s3Storage.test.js

  frontend:
    name: Frontend — lint, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Dependency audit
        # Shared graceful audit gate (scripts/ci-audit.mjs), same as backend.
        # The react-router RSC-mode CSRF advisory that kept this step
        # informational is no longer flagged on react-router 7.18.3, and the
        # last reported high (nanoid < 3.3.18, GHSA-2v37-7h3g-55p8) is closed
        # by the nanoid override — so the gate is a hard failure again.
        run: node ../scripts/ci-audit.mjs
