name: CI

# Triggers: push to master, pull requests targeting master, manual runs.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  backend:
    name: Backend — lint, test, audit
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-not-for-production
      DB_STORAGE: ./data.ci.sqlite
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high

  backend-postgres:
    # PostgreSQL integration tier — proves the migration runner and the full
    # test suite against a real PostgreSQL 16 (the V2 production database).
    name: Backend — PostgreSQL 16 (migrate, test, smoke)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oms
          POSTGRES_PASSWORD: oms
          POSTGRES_DB: oms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oms -d oms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-not-for-production
      DB_DIALECT: postgres
      DATABASE_URL: postgres://oms:oms@localhost:5432/oms_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations on a fresh PostgreSQL
        run: npm run db:migrate
      - name: Verify migration status
        run: npm run db:migrate:status
      - name: Full test suite against PostgreSQL
        run: npm test
      - name: Reset to the pure migration schema
        # The test suite sync()-recreates model tables (a column subset of the
        # migration DDL) and leaves schema_migrations intact, so a bare
        # `db:migrate` would no-op. Reset so the v1→v2 copy and boot smoke run
        # against the real migration schema.
        run: npm run db:reset
      - name: v1 → v2 data migration against PostgreSQL
        run: |
          node scripts/make-v1-fixture.js
          node scripts/migrate-v1-to-v2.js --source ./fixture-v1.sqlite --force
      - name: Seed + production-mode boot smoke
        run: |
          npm run seed:admin -- --name "CI Admin" --email ci@oms.dev --password "CiStr0ngPass!42"
          NODE_ENV=production node scripts/smoke-pg.js

  e2e:
    # Browser-level suite: the real API on a PostgreSQL 16 service + the Vite
    # app, driven with Playwright (login, product CRUD, order creation).
    name: E2E — Playwright (browser, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oms
          POSTGRES_PASSWORD: oms
          POSTGRES_DB: oms_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oms -d oms_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_DIALECT: postgres
      DATABASE_URL: postgres://oms:oms@localhost:5432/oms_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run e2e tests
        run: npx playwright test
        working-directory: frontend
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  s3-storage:
    # S3-compatible storage tier — runs the image-pipeline driver against a
    # real MinIO instance (put → public URL → remove round-trip).
    name: Backend — S3 driver vs MinIO
    runs-on: ubuntu-latest
    services:
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-not-for-production
      DB_STORAGE: ./data.s3.sqlite
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: oms-test
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Create the test bucket
        run: |-
          node --input-type=module -e "
            import { S3Client, CreateBucketCommand } from '@aws-sdk/client-s3';
            const c = new S3Client({ region: 'us-east-1',
              endpoint: 'http://localhost:9000', forcePathStyle: true,
              credentials: { accessKeyId: 'minioadmin', secretAccessKey: 'minioadmin' } });
            await c.send(new CreateBucketCommand({ Bucket: 'oms-test' })).catch((e) => {
              if (!/BucketAlreadyOwned|409|Already exists/.test(String(e))) throw e;
            });
            console.log('bucket ready');
          "
      - name: Run the S3 driver test suite
        run: npx vitest run src/__tests__/s3Storage.test.js

  frontend:
    name: Frontend — lint, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Dependency audit
        # Informational: react-router 7.18.x reports an RSC-mode CSRF advisory
        # that does not apply to this declarative-mode SPA (no server actions).
        # Re-enable as a hard gate once a patched release exists.
        run: npm audit --audit-level=high
        continue-on-error: true
